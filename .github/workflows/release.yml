name: Release

# Run semantic-release on every push to main (i.e. every merged PR).
# It reads the commit messages since the last release, decides the next
# version, updates CHANGELOG.md, tags the commit and publishes a GitHub Release.

on:
  push:
    branches: [main]

permissions:
  contents: write # create tags, releases and commit the changelog
  issues: write # comment on issues referenced in released commits
  pull-requests: write # comment on the PRs that made it into the release

# Never let two releases run at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history + tags
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
