name: Commit messages

# The local hook only runs on machines that installed it. This checks the
# same rules on every PR so nothing non-conventional reaches main. If your
# team squash-merges, also tick "Default to PR title" in the repo's merge
# settings so the squash commit inherits the (linted) PR title.

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
